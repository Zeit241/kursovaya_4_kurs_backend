# === Test profile: isolated DB schema, no outbound email ===
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

app.notifications.enabled=false
spring.task.scheduling.enabled=false

# Mail stub (notifications disabled; avoids real SMTP)
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=test
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false

jwt.secret=mySecretKeyForJWTTokenGenerationAndValidationMustBeAtLeast256BitsLongForSecurity
jwt.expiration=86400000

app.directus.public-url=http://localhost:8055
