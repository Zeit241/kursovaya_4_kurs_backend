<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Данные для входа</title>
</head>
<body style="margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f5f7fa;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width: 600px; margin: 0 auto; padding: 20px;">
        <tr>
            <td>
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 16px 16px 0 0; padding: 30px;">
                    <tr>
                        <td align="center">
                            <h1 style="color: #ffffff; margin: 0; font-size: 24px; font-weight: 600;" th:text="${clinicName}">Медицинский центр</h1>
                        </td>
                    </tr>
                </table>
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color: #ffffff; padding: 40px; border-radius: 0 0 16px 16px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);">
                    <tr>
                        <td>
                            <h2 style="color: #1f2937; margin: 0 0 16px; font-size: 22px; text-align: center;">
                                Данные для входа в систему
                            </h2>
                            <p style="color: #6b7280; margin: 0 0 24px; font-size: 16px; text-align: center;">
                                Здравствуйте<span th:if="${recipientName != null and !recipientName.isBlank()}">, <strong th:text="${recipientName}">Пользователь</strong></span>!
                                Для вас создана учётная запись в личном кабинете клиники.
                            </p>
                            <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color: #f9fafb; border-radius: 12px; padding: 24px; margin-bottom: 24px;">
                                <tr>
                                    <td style="padding: 8px 0; color: #6b7280; font-size: 14px;">Логин (email):</td>
                                </tr>
                                <tr>
                                    <td style="padding: 0 0 16px; color: #1f2937; font-size: 16px; font-weight: 600;" th:text="${loginEmail}">user@example.com</td>
                                </tr>
                                <tr>
                                    <td style="padding: 8px 0; color: #6b7280; font-size: 14px;">Пароль:</td>
                                </tr>
                                <tr>
                                    <td style="padding: 0; color: #1f2937; font-size: 16px; font-family: monospace; font-weight: 600;" th:text="${password}">********</td>
                                </tr>
                            </table>
                            <p style="color: #9ca3af; margin: 0; font-size: 14px; text-align: center;">
                                Рекомендуем сменить пароль после первого входа. Не передавайте эти данные третьим лицам.
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
