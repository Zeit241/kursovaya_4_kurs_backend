# Production profile (Docker / server). Переопределяйте через переменные окружения.

server.port=8085
server.forward-headers-strategy=framework

# === PostgreSQL ===
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/clinic_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:clinic_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:changeme}

# === JPA / Hibernate ===
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false

# === JWT ===
jwt.secret=${JWT_SECRET:change-me-in-production-must-be-at-least-256-bits-long}
jwt.expiration=${JWT_EXPIRATION:86400000}

# === Redis ===
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:redis}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# === Email (опционально) ===
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}

# === App ===
app.clinic.name=${APP_CLINIC_NAME:\u041C\u0435\u0434\u0438\u0446\u0438\u043D\u0441\u043A\u0438\u0439 \u0446\u0435\u043D\u0442\u0440}
app.notifications.enabled=${APP_NOTIFICATIONS_ENABLED:true}
app.directus.public-url=${APP_DIRECTUS_PUBLIC_URL:http://localhost:8055}

# === Actuator (healthcheck в Docker) ===
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
